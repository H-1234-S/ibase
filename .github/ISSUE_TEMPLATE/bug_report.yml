name: Bug report
description: Report a reproducible problem in ibase.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: Before submitting, check whether the issue has already been reported.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js, pnpm, and relevant app versions.
    validations:
      required: true
