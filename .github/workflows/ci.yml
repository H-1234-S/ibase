name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ibase:ibase_ci@localhost:5432/ibase
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ibase
          POSTGRES_USER: ibase
          POSTGRES_PASSWORD: ibase_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ibase -d ibase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Check formatting
        run: pnpm format:check

      - name: Lint workspaces
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Run API unit tests
        run: pnpm --filter api test

      - name: Run API end-to-end tests
        run: pnpm --filter api test:e2e

      - name: Build workspaces
        run: pnpm build
